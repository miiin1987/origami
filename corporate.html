<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>法人のお客様 | ORIGAMI GRP</title>
<link rel="icon" href="assets/emblem-red.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;600;700&amp;family=Geist+Mono:wght@400;500;600&amp;family=Anton&amp;family=Noto+Sans+JP:wght@400;500;700;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#050506}
a{color:#F1F1FF}a:hover{color:#FF9AA5}
@keyframes marquee{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@keyframes sway{0%{transform:rotate(-7deg) scale(1)}50%{transform:rotate(7deg) scale(1.08)}100%{transform:rotate(-7deg) scale(1)}}
@keyframes swayR{0%{transform:rotate(170deg) scale(.85)}50%{transform:rotate(186deg) scale(.95)}100%{transform:rotate(170deg) scale(.85)}}
@keyframes flowL{to{stroke-dashoffset:-1400}}
@keyframes pulseR{0%,100%{opacity:.45;transform:scale(1)}50%{opacity:1;transform:scale(1.18)}}
@keyframes spark{0%{transform:translate(0,0) scale(.5);opacity:0}15%{opacity:1}100%{transform:translate(var(--dx),-480px) scale(1.1);opacity:0}}
@keyframes scanY{0%{top:-2%}100%{top:102%}}
@keyframes jolt{0%,88%,100%{transform:translate(0,0);text-shadow:none}90%{transform:translate(-4px,1px);text-shadow:3px 0 #C8102E,-3px 0 #4FD1FF}92%{transform:translate(3px,-1px);text-shadow:-3px 0 #C8102E,3px 0 #4FD1FF}94%{transform:translate(0,0);text-shadow:none}}
@keyframes tabShine{0%{transform:translateX(-120%) skewX(-20deg)}60%,100%{transform:translateX(320%) skewX(-20deg)}}
@keyframes tabGlow{0%,100%{box-shadow:0 0 0 rgba(200,16,46,0),0 6px 18px rgba(200,16,46,.35)}50%{box-shadow:0 0 0 4px rgba(200,16,46,.18),0 8px 28px rgba(200,16,46,.6)}}
@keyframes barA{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes barB{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes panA{0%{opacity:0;transform:translateY(14px);filter:blur(4px)}100%{opacity:1;transform:none;filter:none}}
@keyframes panB{0%{opacity:0;transform:translateY(14px);filter:blur(4px)}100%{opacity:1;transform:none;filter:none}}
@keyframes tick{0%,100%{opacity:.3}50%{opacity:1}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
.mq{display:flex;width:max-content;animation:marquee 28s linear infinite}
.sway{animation:sway 5s ease-in-out infinite;transform-origin:50% 50%}
.swayR{animation:swayR 6.5s ease-in-out infinite;transform-origin:50% 50%}
.flowL{stroke-dasharray:90 1310;animation:flowL var(--t) linear infinite}
.pulseR{animation:pulseR 2.2s ease-in-out infinite}
.spark{position:absolute;bottom:0;border-radius:50%;animation:spark var(--t) linear infinite}
.scanY{position:absolute;left:0;right:0;height:2px;animation:scanY 2.6s linear infinite}
.jolt{display:inline-block;animation:jolt 2.2s steps(1) infinite}
.tickA{animation:tick 1s ease-in-out infinite}
.svTab{position:relative;overflow:hidden;font-family:'Geist Mono',monospace;font-size:13px;padding:10px 12px;min-height:44px;white-space:nowrap;border-radius:4px;cursor:pointer;transition:transform .2s,border-color .2s,background .2s,color .2s}
.svTab .no{color:#FF5A6E;transition:color .2s}
.svOff{border:1px solid rgba(241,241,255,0.18);background:rgba(255,255,255,0.02);color:#F1F1FF}
.svOff:hover{transform:translateY(-3px);border-color:#C8102E;background:rgba(200,16,46,0.12)}
.svOff:hover .no{color:#FFFFFF}
.svOn{border:1px solid #FF3B55;background:linear-gradient(135deg,#E0143A,#9E0B24);color:#FFFFFF;transform:translateY(-3px);animation:tabGlow 1.6s ease-in-out infinite}
.svOn .no{color:#FFFFFF}
.svOn::before{content:"";position:absolute;top:0;bottom:0;left:0;width:35%;background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,0.45),rgba(255,255,255,0));animation:tabShine 2.2s ease-in-out infinite;pointer-events:none}
.svOn::after{content:"";position:absolute;left:50%;bottom:-1px;width:10px;height:10px;margin-left:-5px;background:#050506;transform:translateY(6px) rotate(45deg)}
.svBar{position:absolute;left:0;right:0;bottom:0;height:3px;background:#FFFFFF;transform-origin:0 50%;pointer-events:none}
.barA{animation:barA 4.5s linear forwards}.barB{animation:barB 4.5s linear forwards}
@media (max-width:640px){
.svList{display:grid !important;grid-template-columns:1fr 1fr;gap:8px !important}
.svTab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;white-space:normal;text-align:center;font-size:12px;line-height:1.45;padding:10px 6px;min-height:64px}
.svTab .no{font-size:11px}
.svList sc-for,.svList sc-if{display:contents}
.svWide{grid-column:1 / -1}
.svOn::after{display:none}
.svOn,.svOff:hover{transform:none}
}
.panA{animation:panA .5s cubic-bezier(.2,.8,.2,1) both}.panB{animation:panB .5s cubic-bezier(.2,.8,.2,1) both}
.caret{animation:blink 1s step-end infinite}
@media (prefers-reduced-motion: reduce){.mq,.sway,.swayR,.flowL,.pulseR,.spark,.scanY,.jolt,.tickA,.svOn,.svOn::before,.barA,.barB,.panA,.panB,.caret{animation:none}}
</style>

</head>
