<style>
body{margin:0;background:#07050F}

@keyframes drift{0%{transform:translateX(-30px)}50%{transform:translateX(30px)}100%{transform:translateX(-30px)}}
@keyframes floaty{0%{transform:translateY(0) rotate(var(--r,0deg))}50%{transform:translateY(-12px) rotate(var(--r,0deg))}100%{transform:translateY(0) rotate(var(--r,0deg))}}
.streak{position:absolute;height:10px;border-radius:999px;filter:blur(1px);animation:drift 9s ease-in-out infinite}

@keyframes gridRun{0%{background-position:0 0,0 0}100%{background-position:0 64px,64px 0}}
@keyframes glow{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:1;transform:scale(1.15)}}
@keyframes flyR{0%{opacity:0;transform:translate(160px,-60px) rotate(12deg) scale(.7)}100%{opacity:1;transform:none}}
@keyframes flyL{0%{opacity:0;transform:translate(-160px,40px) rotate(-12deg) scale(.7)}100%{opacity:1;transform:none}}
@keyframes flyU{0%{opacity:0;transform:translate(0,180px) rotate(8deg) scale(.7)}100%{opacity:1;transform:none}}
@keyframes flip{0%{opacity:0;transform:perspective(800px) rotateY(-120deg) scale(.6)}100%{opacity:1;transform:none}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(0deg)}25%{transform:translateY(-16px) rotate(1.6deg)}75%{transform:translateY(12px) rotate(-1.6deg)}}
@keyframes tilt{0%,100%{transform:perspective(900px) rotateY(-10deg) rotateX(4deg)}50%{transform:perspective(900px) rotateY(10deg) rotateX(-4deg)}}
@keyframes chatA{0%,6%{opacity:0;transform:scale(.4)}12%,90%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.9)}}
@keyframes chatB{0%,30%{opacity:0;transform:translateY(14px) scale(.6)}38%,90%{opacity:1;transform:none}100%{opacity:0}}
@keyframes dots{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes rise{0%{transform:translateY(0) scale(.5);opacity:0}15%{opacity:1}100%{transform:translateY(-420px) scale(1.2);opacity:0}}
@keyframes dash{to{stroke-dashoffset:-60}}
@keyframes blurIn{0%{opacity:0;filter:blur(14px);transform:translateY(.35em) scale(1.1)}100%{opacity:1;filter:blur(0);transform:none}}
@keyframes shineT{0%{background-position:-200% 0}100%{background-position:200% 0}}
@keyframes ping{0%{transform:scale(1);opacity:.8}100%{transform:scale(2.4);opacity:0}}
@keyframes wave{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}
@keyframes fill{0%,8%{width:8%}40%,85%{width:62%}100%{width:62%}}
@keyframes stepOn{0%,30%{background:rgba(255,255,255,.15);transform:scale(1)}36%{transform:scale(1.4)}40%,100%{background:#FFFFFF;transform:scale(1)}}
@keyframes toast{0%,15%{opacity:0;transform:translateX(80px)}22%,80%{opacity:1;transform:none}90%,100%{opacity:0;transform:translateX(-20px)}}
@keyframes ring{0%,100%{transform:rotate(0)}10%{transform:rotate(18deg)}20%{transform:rotate(-16deg)}30%{transform:rotate(12deg)}40%{transform:rotate(-8deg)}50%{transform:rotate(0)}}
.shoot{position:absolute;left:0;height:6px;border-radius:999px;animation:shoot var(--t) cubic-bezier(.5,0,.3,1) infinite}
.shootL{position:absolute;right:0;height:6px;border-radius:999px;animation:shootL var(--t) cubic-bezier(.5,0,.3,1) infinite}
.grid{animation:gridRun 1.6s linear infinite}
.glow{animation:glow 2.4s ease-in-out infinite}

.bob{animation:bob 3.2s ease-in-out infinite}
.tilt{animation:tilt 4s ease-in-out infinite}
.cA{animation:chatA 5s ease infinite;transform-origin:100% 100%}
.cB{animation:chatB 5s ease infinite;transform-origin:0 100%}
.dt{animation:dots .6s ease-in-out infinite}
.pt{position:absolute;bottom:-10px;border-radius:50%;animation:rise var(--t) linear infinite}
.flowline{stroke-dasharray:6 10;animation:dash .8s linear infinite}
.ch{display:inline-block;opacity:0;animation:blurIn .5s cubic-bezier(.2,.7,.2,1) forwards}
.shineT{background:linear-gradient(100deg,#FFFFFF 40%,#9FB2FF 46%,#F0D9A8 52%,#FFFFFF 58%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shineT 1.8s ease-in-out 1.1s infinite}
.ping{animation:ping 1.4s ease-out infinite}
.wv{display:inline-block;width:4px;border-radius:2px;background:#7DE8F0;transform-origin:50% 100%;animation:wave .5s ease-in-out infinite}
.fill{animation:fill 4s cubic-bezier(.6,0,.3,1) infinite}
.stp{animation:stepOn 4s ease infinite}
.toast{animation:toast 4.5s ease infinite}
.bell{display:inline-block;animation:ring 1.5s ease infinite;transform-origin:50% 0}
.cmp{width:100%;min-width:680px;border-collapse:collapse;font-size:15px}

.heroRow{display:flex;gap:40px;align-items:center}
.heroText{flex:0 0 56%;min-width:0;container-type:inline-size}

@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
@keyframes btnGlow{0%,100%{box-shadow:0 0 30px rgba(139,92,246,.5)}50%{box-shadow:0 0 70px rgba(224,67,181,.9),0 0 20px rgba(91,124,255,.8)}}
@keyframes sweepBg{0%{transform:translateX(-100%) skewX(-20deg)}100%{transform:translateX(250%) skewX(-20deg)}}
.shineG{background:linear-gradient(100deg,#F0D9A8 40%,#FFFFFF 48%,#FFE7A8 52%,#F0D9A8 60%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shineT 1.6s ease-in-out infinite}
.spinS{animation:spinS 3s linear infinite}
.beat{display:inline-block;animation:beat 1.6s ease-in-out infinite}

@media (prefers-reduced-motion: reduce){.streak,.floaty,.shoot,.shootL,.grid,.glow,.inR,.inL,.inU,.inF,.bob,.tilt,.cA,.cB,.dt,.pt,.flowline,.ch,.shineT,.ping,.wv,.fill,.stp,.toast,.bell,.shineG,.spinS,.beat,.btnGlow,.sweepBg{animation:none;opacity:1;filter:none;transform:none}}

<script>

function rnd(n) { var x = Math.sin(n * 9301 + 49297) * 233280; return x - Math.floor(x); }
function chars(s, st) { return s.split('').map(function (t, i) { return { t: t, d: (st + i * 0.045).toFixed(2) + 's' }; }); }
var COLS = ['#5B7CFF', '#E043B5', '#8B5CF6', '#D9B26A', '#7DE8F0', '#B9C6FF'];
var STREAKS = [];
for (var i = 0; i < 12; i++) {
  var c = COLS[i % 6]; var left = i % 3 !== 2;
  STREAKS.push({ cls: left ? 'shoot' : 'shootL', top: (4 + rnd(i + 1) * 88).toFixed(1) + '%', w: (180 + Math.round(rnd(i + 2) * 320)) + 'px', h: (2 + Math.round(rnd(i + 3) * 6)) + 'px', bg: left ? 'linear-gradient(90deg, rgba(0,0,0,0), ' + c + ')' : 'linear-gradient(270deg, rgba(0,0,0,0), ' + c + ')', c: c, t: (1.1 + rnd(i + 4) * 1.3).toFixed(2) + 's', d: (-rnd(i + 5) * 2.4).toFixed(2) + 's' });
}
var GCOLS = ['#D9B26A', '#F0D9A8', '#FFE7A8', '#8B5CF6'];
var GSTREAKS = [];
for (var g = 0; g < 8; g++) { var gc = GCOLS[g % 4]; var gl = g % 2 === 0; GSTREAKS.push({ cls: gl ? 'shoot' : 'shootL', top: (6 + rnd(g + 201) * 86).toFixed(1) + '%', w: (200 + Math.round(rnd(g + 202) * 300)) + 'px', h: (2 + Math.round(rnd(g + 203) * 5)) + 'px', bg: gl ? 'linear-gradient(90deg, rgba(0,0,0,0), ' + gc + ')' : 'linear-gradient(270deg, rgba(0,0,0,0), ' + gc + ')', c: gc, t: (1.2 + rnd(g + 204) * 1.2).toFixed(2) + 's', d: (-rnd(g + 205) * 2.4).toFixed(2) + 's' }); }
var GPARTS = [];
for (var h = 0; h < 20; h++) GPARTS.push({ x: (rnd(h + 301) * 100).toFixed(1) + '%', s: (2 + Math.round(rnd(h + 302) * 4)) + 'px', c: GCOLS[h % 3], t: (1.6 + rnd(h + 303) * 2).toFixed(2) + 's', d: (-rnd(h + 304) * 3).toFixed(2) + 's' });
var PARTS = [];
for (var j = 0; j < 30; j++) PARTS.push({ x: (rnd(j + 31) * 100).toFixed(1) + '%', s: (2 + Math.round(rnd(j + 32) * 4)) + 'px', c: COLS[j % 6], t: (1.6 + rnd(j + 33) * 2).toFixed(2) + 's', d: (-rnd(j + 34) * 3).toFixed(2) + 's' });
class Component extends DCLogic {

      clock: (mm < 10 ? '0' : '') + mm + ':' + (ss < 10 ? '0' : '') + ss,

    };
  }
}
